# Accessible Seerr — static container Nginx configuration.
#
# This file configures the Nginx process INSIDE the accessible-seerr
# container only. It intentionally contains:
#   - no public hostname (server_name is left as the default catch-all)
#   - no TLS configuration (TLS is terminated by your reverse proxy)
#   - no proxying to the Seerr API (the reverse proxy handles /api/ routing)
#
# The reverse proxy in front of this container is expected to strip the
# configured ACCESSIBLE_PATH prefix before forwarding requests here (see
# templates/nginx-site.conf.template and templates/caddyfile.template),
# so this server always sees paths relative to "/".

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not reveal directory contents.
    autoindex off;

    # Security headers. The CSP intentionally requires no 'unsafe-inline'
    # or 'unsafe-eval' — all JavaScript and CSS ship as external same-origin
    # files.
    #
    # Nginx does not inherit add_header directives from a parent block into
    # any location block that defines its own add_header — so every
    # location below that sets Cache-Control also repeats the full set of
    # security headers explicitly, rather than relying on inheritance.

    # Do not proxy anything from this container. Seerr's own API and the
    # main Seerr interface are routed by the reverse proxy in front of
    # this container, not by this server block.

    location = /index.html {
        # Keep the HTML shell revalidated so deployments update promptly,
        # without disabling caching entirely.
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ =404;
    }

    # Long-lived caching for static assets. This project ships only a small
    # number of unhashed files, so caching stays moderate rather than
    # aggressive; index.html is excluded above.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Hide dotfiles.
    location ~ /\. {
        deny all;
    }
}
